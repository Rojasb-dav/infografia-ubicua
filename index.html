<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- Configuración mobile-first y prevención de zoom para AR -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#6D28D9" />
  <title>Infografía Ubicua</title>

  <!-- Hoja de estilos -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- A-Frame 1.3.0 (compatible con AR.js NFT) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- AR.js NFT - jsdelivr (más fiable que raw.githack) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>
</head>
<body>

  <!-- ============================================================= -->
  <!-- PANTALLA DE BIENVENIDA                                         -->
  <!-- ============================================================= -->
  <section id="welcome-screen" class="welcome-screen">
    <div class="welcome-card">
      <h1 class="welcome-title">Infografía Ubicua</h1>
      <p class="welcome-subtitle">Apoyos estudiantiles en Realidad Aumentada</p>

      <!-- Imagen del marcador para que el usuario sepa qué escanear -->
      <img
        src="assets/marcador_generico.png"
        alt="Marcador físico"
        class="welcome-marker"
      />

      <p class="welcome-instruction">
        Permite el acceso a la cámara y apunta al marcador
      </p>

      <!-- Botón para iniciar la experiencia AR -->
      <button id="btn-start-ar" class="btn-primary">
        🚀 Iniciar experiencia AR
      </button>

      <!-- Sección "Mis Oportunidades Guardadas" -->
      <div class="saved-section">
        <h2 class="saved-title">📌 Mis Oportunidades Guardadas</h2>
        <div id="saved-list" class="saved-list">
          <!-- Generado dinámicamente desde JS -->
        </div>
        <button id="btn-clear-saved" class="btn-clear" style="display:none;">
          🗑️ Limpiar todo
        </button>
      </div>
    </div>
  </section>

  <!-- ============================================================= -->
  <!-- PANTALLA AR (oculta hasta que se inicia)                       -->
  <!-- ============================================================= -->
  <div id="ar-screen" class="ar-screen" style="display:none;">

    <!-- La escena AR se inyecta dinámicamente desde JS al iniciar la experiencia,
         para que getUserMedia se solicite tras un gesto del usuario y para que
         AR.js no inicialice mientras la pantalla está oculta. -->
    <div id="ar-scene-container"></div>

    <!-- ----------- Overlay HTML (encima del canvas AR) ----------- -->

    <!-- Indicador de estado del marcador -->
    <div id="marker-status" class="marker-status">
      <span id="marker-status-text">🔍 Buscando marcador...</span>
    </div>

    <!-- Header superior -->
    <header class="ar-header">
      <button id="btn-back" class="btn-back">← Volver</button>
      <div class="ar-header-center">
        <span id="poster-indicator" class="poster-indicator">1/3</span>
        <span id="poster-area" class="poster-area">SOPORTE</span>
      </div>
      <div class="ar-header-spacer"></div>
    </header>

    <!-- Flechas laterales de navegación -->
    <button id="btn-prev" class="nav-arrow nav-arrow-left" aria-label="Anterior">‹</button>
    <button id="btn-next" class="nav-arrow nav-arrow-right" aria-label="Siguiente">›</button>

    <!-- Toolbar inferior con 4 acciones -->
    <nav id="ar-toolbar" class="ar-toolbar">
      <button class="toolbar-btn" data-action="guardar">
        <span class="toolbar-icon">💾</span>
        <span class="toolbar-label">Guardar</span>
      </button>
      <button class="toolbar-btn" data-action="requisitos">
        <span class="toolbar-icon">📋</span>
        <span class="toolbar-label">Requisitos</span>
      </button>
      <button class="toolbar-btn" data-action="recordatorio">
        <span class="toolbar-icon">⏰</span>
        <span class="toolbar-label">Recordatorio</span>
      </button>
      <button class="toolbar-btn" data-action="contactar">
        <span class="toolbar-icon">💬</span>
        <span class="toolbar-label">Contactar</span>
      </button>
    </nav>

  </div>

  <!-- ============================================================= -->
  <!-- TOASTS (notificaciones flotantes)                              -->
  <!-- ============================================================= -->
  <div id="toast-container" class="toast-container"></div>

  <!-- ============================================================= -->
  <!-- BOTTOM SHEET DE REQUISITOS                                     -->
  <!-- ============================================================= -->
  <div id="sheet-overlay" class="sheet-overlay" style="display:none;"></div>
  <div id="requisitos-sheet" class="sheet" style="display:none;">
    <div class="sheet-header">
      <h3 id="sheet-title">📋 Requisitos</h3>
    </div>
    <div id="sheet-body" class="sheet-body">
      <!-- Generado dinámicamente -->
    </div>
    <div class="sheet-footer">
      <button id="btn-close-sheet" class="btn-secondary">Cerrar</button>
    </div>
  </div>

  <!-- Lógica de la app -->
  <script src="js/app.js"></script>
</body>
</html>
